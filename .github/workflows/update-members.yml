name: Update members

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Build members.json
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          OFFICIAL_ROLE_ID: ${{ secrets.OFFICIAL_ROLE_ID }}
          VISITOR_ROLE_ID: ${{ secrets.VISITOR_ROLE_ID }}
        run: python update_members.py

      - name: Remove non-official drivers from job logs
        run: python filter_joblog.py

      - name: Commit changes
        run: |
          git config user.name "apex-data-bot"
          git config user.email "apex-data-bot@users.noreply.github.com"
          for f in members.json jobs.json apex_drivers.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update members"
            git pull --rebase
            git push
          fi
