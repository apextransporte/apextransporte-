name: Update stats
on:
schedule:
- cron: "*/15 * * * *"
workflow_dispatch:
permissions:
contents: write
jobs:
update:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: "3.12"
- name: Install Tesseract
run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
- name: Install libraries
run: pip install -r requirements.txt
- name: Run bot
env:
DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
DISCORD_STATS_CHANNEL_ID: ${{ secrets.DISCORD_STATS_CHANNEL_ID }}
run: python update_stats.py
- name: Save results
run: |
git config user.name "apex-bot"
git config user.email "apex-bot@users.noreply.github.com"
git add -A
git diff --cached --quiet || git commit -m "Update stats"
git push
