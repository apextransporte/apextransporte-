name: Update stats

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install requests pillow pytesseract
      - name: Fetch latest numbers and write data.json
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_STATS_CHANNEL_ID: ${{ secrets.DISCORD_STATS_CHANNEL_ID }}
        run: python3 update_stats.py
      - name: Commit data.json if it changed
        run: |
          cat data.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json jobs.json
          git diff --staged --quiet || git commit -m "Update stats"
          git push
